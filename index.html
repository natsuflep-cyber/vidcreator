<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Última Vez</title>
  <meta name="description" content="Animação: a última vez que você viu alguém que ama.">
  <style>
    :root { color-scheme: dark; --bg:#14122e; --fg:#f4f1ff; --accent:#ffe246; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:20px; padding:24px 16px; background:linear-gradient(#14122e,#2a1a48);
           color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    h1 { margin:0; font-size:clamp(1.6rem,5vw,2.4rem); letter-spacing:.02em; color:var(--accent); }
    p  { margin:0; opacity:.8; text-align:center; }
    video { width:min(92vw,420px); aspect-ratio:9/16; border-radius:18px; background:#000;
            box-shadow:0 20px 60px rgba(0,0,0,.5); }
    a.btn { display:inline-block; padding:12px 22px; border-radius:999px; background:var(--accent);
            color:#1b1530; font-weight:700; text-decoration:none; }
    a.btn:focus-visible, video:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  </style>
</head>
<body>
  <h1>A Última Vez</h1>
  <p>Ninguém avisa quando é a última vez.</p>
  <video src="a_ultima_vez.mp4" controls playsinline preload="metadata"></video>
  <a class="btn" href="a_ultima_vez.mp4" download>Baixar vídeo</a>
</body>
</html>
